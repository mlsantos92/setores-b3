name: Atualização diária

on:
  schedule:
    # 08:30 e 19:15 em Brasília (11:30 e 22:15 UTC), de segunda a sexta
    - cron: "30 11 * * 1-5"
    - cron: "15 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Testes
        id: testes
        run: pytest -q
        continue-on-error: true

      - name: Coletar dados e calcular o estudo
        env:
          TESTES_OK: ${{ steps.testes.outcome == 'success' && '1' || '0' }}
        run: python scripts/atualizar.py

      - name: Gravar alterações
        run: |
          git config user.name "atualizacao-automatica"
          git config user.email "noreply@github.com"
          git add docs outputs data/processed
          git diff --cached --quiet || git commit -m "Atualiza preços, múltiplos e selo ($(date -u +%Y-%m-%d))"
          git pull --rebase -q origin main
          git push
