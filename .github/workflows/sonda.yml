name: Sonda de fontes
on:
  workflow_dispatch:
  push:
    paths: ["scripts/sonda.py", ".github/workflows/sonda.yml"]
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance
      - run: python scripts/sonda.py
